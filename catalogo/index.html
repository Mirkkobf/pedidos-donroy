$('#bNext').onclick = $('#sNext').onclick = () => pf.flipNext('top');
$('#bFirst').onclick = () => go(0);
$('#bLast').onclick = () => go(N - 1);
$('#bIdx').onclick = () => go(1);
$('#pIn').addEventListener('focus', e => e.target.select());
$('#pIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = parseInt(e.target.value, 10); if (v) go(v - 1); e.target.blur(); } });
$('#pIn').addEventListener('blur', sync);
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (!$('#zv').hidden) { if (e.key === 'Escape') closeZoom(); if (e.key === '+' || e.key === '=') zoomBy(1); if (e.key === '-') zoomBy(-1); return; }
  if (!$('#drawer').hidden) { if (e.key === 'Escape') closeDrawer(); return; }
  if (e.key === 'ArrowLeft') pf.flipPrev('top');
  else if (e.key === 'ArrowRight') pf.flipNext('top');
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
});
// thumbnails
const openDrawer = () => { $('#drawer').hidden = false; sync(); const c = document.querySelector('.th.cur'); if (c) c.scrollIntoView({block: 'center'}); $('#dClose').focus(); };
const closeDrawer = () => { $('#drawer').hidden = true; $('#bTh').focus(); };
$('#bTh').onclick = openDrawer; $('#dClose').onclick = closeDrawer;
$('#drawer').addEventListener('click', e => { const t = e.target.closest('.th'); if (t) { closeDrawer(); go(+t.dataset.p - 1); } else if (e.target === $('#drawer')) closeDrawer(); });
// zoom: shows the visible page(s) large, with pinch zoom on phones
const ZS = [1, 1.5, 2, 3]; let zi = 0;
function zoomBy(d) { zi = Math.max(0, Math.min(ZS.length - 1, zi + d)); applyZoom(); }
function applyZoom() {
  const two = $('#zin').children.length === 2, base = two ? 'min(49vw, 700px)' : 'min(calc(100vw - 24px), 900px)';
  $('#zin').style.setProperty('--zw', `calc(${base} * ${ZS[zi]})`);
  $('#zLbl').textContent = Math.round(ZS[zi] * 100) + '%';
  $('#zOut').disabled = zi === 0; $('#zIn').disabled = zi === ZS.length - 1;
}
function openZoom() {
  const i = pf.getCurrentPageIndex(), l = label(), ps = l.txt.includes('–') && innerWidth > 900 ? [l.a, l.a + 1] : [i + 1];
  $('#zin').innerHTML = ps.map(p => `<img src="p/${String(p).padStart(2, '0')}.webp" alt="Página ${p}">`).join('');
  zi = 0; applyZoom(); $('#zv').hidden = false; $('#zbar').hidden = false; $('#zv').scrollTo(0, 0); $('#zClose').focus();
}
function closeZoom() { $('#zv').hidden = true; $('#zbar').hidden = true; $('#bZoom').focus(); }
$('#bZoom').onclick = openZoom; $('#zClose').onclick = closeZoom; $('#zIn').onclick = () => zoomBy(1); $('#zOut').onclick = () => zoomBy(-1);
$('#zv').addEventListener('dblclick', () => zoomBy(zi === ZS.length - 1 ? -9 : 1));
// fullscreen
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); };
if (!document.documentElement.requestFullscreen) $('#bFull').hidden = true;
</script>
</body></html>
