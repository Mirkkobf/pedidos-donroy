<script>
const N = 36;
const $ = s => document.querySelector(s);
// revista abrochada: tapa, páginas 2..35 y contratapa (sin forro interno)
const SEQ = [{n: 1, hard: 1, cls: 'cover front'}];
for (let n = 2; n < N; n++) SEQ.push({n});
SEQ.push({n: N, hard: 1, cls: 'cover back'});
const T = SEQ.length;
const pgIdx = n => Math.max(0, Math.min(T - 1, n - 1));
const idxPg = i => SEQ[i] && SEQ[i].n;
let LINKS = [], pf = null, mode = null;

function pageHTML(s, i) {
  if (s.tx) return `<div class="page tx ${s.tx} ${s.cls || ''}"${s.hard ? ' data-density="hard"' : ''}>${s.tx === 'fly' && i < 4 ? '<img class="flylogo" src="/img/logo_color.png" alt="">' : ''}</div>`;
  const links = (LINKS[s.n - 1] || []).map(([x, y, w, h, t]) => {
    const st = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
    if (typeof t === 'number') return `<a class="ln" style="${st}" href="#p=${t + 1}" data-go="${t + 1}" aria-label="Ir a la página ${t}"></a>`;
    const ext = !/^(tel|mailto):/.test(t), lbl = t.startsWith('tel:') ? 'Llamar' : t.startsWith('mailto:') ? 'Enviar correo' : 'Abrir WhatsApp';
    return `<a class="ln" style="${st}" href="${t}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''} aria-label="${lbl}"></a>`;
  }).join('');
  return `<div class="page pg ${s.cls || ''}"${s.hard ? ' data-density="hard"' : ''}><img src="p/${String(s.n).padStart(2, '0')}.webp" alt="${s.n === 1 ? 'Tapa' : s.n === N ? 'Contratapa' : 'Página ' + (s.n - 1)}"${s.n > 5 ? ' loading="lazy"' : ''} decoding="async">${links}</div>`;
}

// one page on phones held upright, the open spread everywhere else (phones sideways included)
const wantPortrait = () => innerWidth < innerHeight && innerWidth <= 760;
function setLayout() {
  const short = innerHeight <= 520 && innerWidth > innerHeight;
  document.body.classList.toggle('short', short);
  document.body.classList.toggle('port', wantPortrait());
}

function build(start) {
  setLayout();
  mode = wantPortrait() ? 'portrait' : 'landscape';
  const old = $('#book'); if (pf) { try { pf.destroy(); } catch (e) {} }
  if (old && old.isConnected) old.remove();
  const book = document.createElement('div'); book.id = 'book';
  book.innerHTML = SEQ.map(pageHTML).join('');
  $('#bookw').insertBefore(book, $('#edgeL'));
  pf = new St.PageFlip(book, {
    width: 596, height: 842, size: 'stretch', minWidth: mode === 'portrait' ? Math.ceil(innerWidth) : 90, maxWidth: 1400, minHeight: 120, maxHeight: 1980,
    showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: .35, flippingTime: 650,
    drawShadow: true, startPage: start, clickEventForward: true, swipeDistance: 24
  });
  pf.loadFromHTML(book.querySelectorAll('.page'));
  pf.on('flip', sync); pf.on('changeOrientation', sync); pf.on('changeState', edges);
  pf.on('init', () => { sync(); $('#bookw').classList.add('ready'); const l = $('#load'); if (l) l.remove(); });
}

function visible() {
  const i = pf.getCurrentPageIndex(), port = pf.getOrientation() === 'portrait';
  if (port || i === 0 || i === T - 1) return [i];
  const a = i % 2 ? i : i - 1; return [a, a + 1];
}
function label() {
  const ps = visible().map(idxPg).filter(Boolean);
  // printed numbers: the cover is page 0, the index page 1
  if (!ps.length) return visible()[0] < 3 ? {a: 1, txt: 'Tapa'} : {a: N, txt: 'Contratapa'};
  if (ps[0] === 1) return {a: 1, txt: 'Tapa'};
  if (ps[0] === N) return {a: N, txt: 'Contratapa'};
  return {a: ps[0], txt: ps.length > 1 ? `${ps[0] - 1}–${ps[1] - 1}` : String(ps[0] - 1)};
}
function sync() {
  if (!pf) return;
  const i = pf.getCurrentPageIndex(), l = label();
  if (document.activeElement !== $('#pIn')) $('#pIn').value = l.txt;
  ['#bPrev', '#sPrev', '#bFirst'].forEach(s => $(s).disabled = i === 0);
  ['#bNext', '#sNext', '#bLast'].forEach(s => $(s).disabled = i >= T - 1);
  history.replaceState(null, '', '#p=' + (l.a - 1));
  const two = l.txt.includes('–');
  document.querySelectorAll('.th').forEach(t => { const p = +t.dataset.p; t.classList.toggle('cur', p === l.a || (two && p === l.a + 1)); });
  edges();
}
// page-block thickness on the outer sides, proportional to the pages on each side (spread view only)
function edges() {
  const L = $('#edgeL'), R = $('#edgeR');
  if (!pf || pf.getOrientation() === 'portrait') { L.hidden = R.hidden = true; return; }
  const b = pf.getBoundsRect(), vis = visible(), i = vis[0];
  const tot = Math.max(6, Math.min(22, b.pageWidth * .04));
  const closedFront = vis.length === 1 && i === 0, closedBack = vis.length === 1 && i === T - 1;
  const leftShare = closedFront ? 0 : closedBack ? 1 : (i + 1) / T;
  const x0 = closedFront ? b.left + b.pageWidth : b.left, x1 = closedBack ? b.left + b.pageWidth : b.left + b.width;
  const lt = Math.round(tot * leftShare), rt = Math.round(tot * (1 - leftShare));
  const set = (el, w, x) => { el.hidden = w < 1; el.style.cssText = `--w:${w}px;left:${x}px;top:${b.top}px;height:${b.height}px;width:${w}px`; };
  set(L, lt, x0 - lt); set(R, rt, x1);
}

const go = n => { const i = pgIdx(Math.max(1, Math.min(N, n))); if (i !== pf.getCurrentPageIndex()) pf.flip(i, 'top'); };
document.addEventListener('click', e => { const a = e.target.closest('.ln[data-go]'); if (a) { e.preventDefault(); go(+a.dataset.go); } });
$('#bPrev').onclick = $('#sPrev').onclick = () => pf.flipPrev('top');
$('#bNext').onclick = $('#sNext').onclick = () => pf.flipNext('top');
$('#bFirst').onclick = () => pf.flip(0, 'top');
$('#bLast').onclick = () => pf.flip(T - 1, 'top');
$('#bIdx').onclick = () => go(2);
$('#pIn').addEventListener('focus', e => e.target.select());
$('#pIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const t = e.target.value.trim(), v = /^t/i.test(t) ? 0 : /^c/i.test(t) ? N - 1 : parseInt(t, 10); if (v >= 0) go(Math.min(N, v + 1)); e.target.blur(); } });
$('#pIn').addEventListener('blur', sync);
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (!$('#zv').hidden) { if (e.key === 'Escape') closeZoom(); if (e.key === '+' || e.key === '=') zoomBy(1); if (e.key === '-') zoomBy(-1); return; }
  if (!$('#drawer').hidden) { if (e.key === 'Escape') closeDrawer(); return; }
  if (e.key === 'ArrowLeft') pf.flipPrev('top');
  else if (e.key === 'ArrowRight') pf.flipNext('top');
  else if (e.key === 'Home') pf.flip(0, 'top'); else if (e.key === 'End') pf.flip(T - 1, 'top');
});
// thumbnails
const openDrawer = () => { $('#drawer').hidden = false; sync(); const c = document.querySelector('.th.cur'); if (c) c.scrollIntoView({block: 'center'}); $('#dClose').focus(); };
const closeDrawer = () => { $('#drawer').hidden = true; if ($('#bTh')) $('#bTh').focus(); };
if ($('#bTh')) $('#bTh').onclick = openDrawer; $('#dClose').onclick = closeDrawer;
$('#drawer').addEventListener('click', e => { const t = e.target.closest('.th'); if (t) { closeDrawer(); go(+t.dataset.p); } else if (e.target === $('#drawer')) closeDrawer(); });
// zoom: the visible catalog page(s), large, with pinch zoom on phones
const ZS = [1, 1.5, 2, 3]; let zi = 0;
function zoomBy(d) { zi = Math.max(0, Math.min(ZS.length - 1, zi + d)); applyZoom(); }
function applyZoom() {
  const two = $('#zin').children.length === 2, base = two ? 'min(49vw, 700px)' : 'min(calc(100vw - 24px), 900px)';
  $('#zin').style.setProperty('--zw', `calc(${base} * ${ZS[zi]})`);
  $('#zLbl').textContent = Math.round(ZS[zi] * 100) + '%';
  $('#zOut').disabled = zi === 0; $('#zIn').disabled = zi === ZS.length - 1;
}
function openZoom() {
  let ps = visible().map(idxPg).filter(Boolean); if (!ps.length) ps = [label().a];
  if (innerWidth <= 900) ps = ps.slice(0, 1);
  $('#zin').innerHTML = ps.map(p => `<img src="p/${String(p).padStart(2, '0')}.webp" alt="Página ${p}">`).join('');
  zi = 0; applyZoom(); $('#zv').hidden = false; $('#zbar').hidden = false; $('#zv').scrollTo(0, 0); $('#zClose').focus();
}
function closeZoom() { $('#zv').hidden = true; $('#zbar').hidden = true; if ($('#bZoom')) $('#bZoom').focus(); }
if ($('#bZoom')) $('#bZoom').onclick = openZoom; $('#zClose').onclick = closeZoom; $('#zIn').onclick = () => zoomBy(1); $('#zOut').onclick = () => zoomBy(-1);
$('#zv').addEventListener('dblclick', () => zoomBy(zi === ZS.length - 1 ? -9 : 1));
// fullscreen
if ($('#bFull')) $('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); };
if (!document.documentElement.requestFullscreen && $('#bFull')) $('#bFull').hidden = true;

let rt;
addEventListener('resize', () => { setLayout(); clearTimeout(rt); rt = setTimeout(() => {
  const want = wantPortrait() ? 'portrait' : 'landscape';
  if (pf && want !== mode) build(pf.getCurrentPageIndex()); else edges();
}, 180); });

const startN = parseInt((location.hash.match(/p=(\d+)/) || [])[1] || '0', 10) + 1;
fetch('links.json').then(r => r.json()).catch(() => []).then(l => {
  LINKS = l; build(pgIdx(Math.max(1, Math.min(N, startN))));
  try { if (!localStorage.getItem('dr-flip-hint')) { $('#hint').classList.add('on'); setTimeout(() => $('#hint').classList.remove('on'), 3200); localStorage.setItem('dr-flip-hint', '1'); } } catch (e) {}
});
setTimeout(() => { if ($('#load')) { $('#bookw').classList.add('ready'); $('#load').remove(); } }, 3000);
</script>
</body></html>
